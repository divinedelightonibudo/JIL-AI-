<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JIL AI Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #35105c 0%, transparent 35%),
        radial-gradient(circle at bottom right, #241047 0%, transparent 35%),
        #09090d;
    color: white;
    height: 100vh;
}

.chat {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 70px;
    padding: 0 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.1);
    background: rgba(10,10,15,.8);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.home {
    color: #aaa;
    text-decoration: none;
}

.home:hover {
    color: white;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.welcome {
    text-align: center;
    margin-top: 100px;
    color: #aaa;
}

.brain {
    font-size: 60px;
}

.message {
    max-width: 800px;
    margin: 15px auto;
    display: flex;
}

.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user .bubble {
    background: linear-gradient(135deg, #7c3aed, #8b5cf6);
}

.jil .bubble {
    background: #171720;
    border: 1px solid rgba(255,255,255,.08);
}

.input-area {
    padding: 15px 20px 25px;
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 8px;
    padding: 8px;
    background: #15151d;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 12px;
    font-family: inherit;
    font-size: 16px;
}

button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: #8b5cf6;
    color: white;
    cursor: pointer;
    font-size: 20px;
}

button:hover {
    background: #7c3aed;
}

@media(max-width: 600px) {
    .bubble {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<div class="chat">

    <header class="header">
        <div class="logo">✦ <span>JIL</span> AI</div>
        <a class="home" href="index.html">← Home</a>
    </header>

    <main id="messages" class="messages">

        <div id="welcome" class="welcome">
            <div class="brain">🧠</div>
            <h2>Hi! I'm JIL 👋</h2>
            <p>Ask me anything and let's explore together.</p>
        </div>

    </main>

    <div class="input-area">
        <div class="input-box">

            <textarea
                id="userInput"
                placeholder="Message JIL..."
                rows="1"
                onkeydown="handleKey(event)">
            </textarea>

            <button onclick="sendMessage()">➤</button>

        </div>
    </div>

</div>

<script>

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

}


function addMessage(type, text) {

    document.getElementById("welcome").style.display = "none";

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


async function sendMessage() {

    const input = document.getElementById("userInput");

    const text = input.value.trim();

    if (!text) return;

    addMessage("user", text);

    input.value = "";

    addMessage("jil", "JIL is thinking...");

    const thinkingBubble =
        document.querySelector(".jil:last-child .bubble");

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
        }

        thinkingBubble.textContent = data.reply;

    } catch (error) {

        thinkingBubble.textContent =
            "Sorry, JIL couldn't connect to her AI brain right now. 😕";

        console.error(error);

    }

}

</script>

</body>
</html>
