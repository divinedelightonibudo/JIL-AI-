```html

<style>
*{box-sizing:border-box}

:root{
    --bg:#07070b;
    --panel:#0d0d14;
    --purple:#8b5cf6;

        radial-gradient(circle at 10% 0%,rgba(139,92,246,.2),transparent 30%),
        radial-gradient(circle at 90% 100%,rgba(109,40,217,.15),transparent 35%),

.app{
    height:100vh;

.sidebar{
    width:270px;

    flex-direction:column;

.brand{
    display:flex;
    align-items:center;

    box-shadow:0 0 25px rgba(139,92,246,.35);

.brand span{

.history-item:hover{
    background:#171720;

    flex:1;

}

    font-weight:bold;
}

.status{
    color:#6ee7b7;

}

.home{
    color:#9696a8;

    font-size:13px;

.home:hover{
    color:white;

.messages{
    flex:1;
    overflow-y:auto;

    max-width:700px;

    text-align:center;
}

.welcome-orb{
    width:90px;
    height:90px;

    display:grid;
    place-items:center;
    border-radius:28px;
    font-size:43px;
    background:linear-gradient(135deg,#8b5cf6,#4c1d95);
    box-shadow:0 0 35px rgba(139,92,246,.35);
    animation:float 3s ease-in-out infinite;

@keyframes float{
    50%{transform:translateY(-8px)}
}

        opacity:0;

    justify-content:flex-end;
}

.avatar{
    width:32px;
    height:32px;
    flex:0 0 32px;
    display:grid;

    border-radius:10px;
    background:#191923;
}

.message.user .avatar{
    order:2;
    background:linear-gradient(135deg,#7c3aed,#8b5cf6);
}

.content{
    max-width:75%;
}

    padding:13px 16px;

    word-wrap:break-word;

.message.jil .bubble{
    background:rgba(20,20,29,.92);

.message.user .bubble{
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
}

.time{
    margin-top:5px;

    font-size:10px;
}

    display:flex;

}

.dot{

    height:7px;
    border-radius:50%;

    animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;

.input-box:focus-within{
    border-color:rgba(139,92,246,.6);

textarea{
    flex:1;
    min-height:45px;

    font-family:inherit;
    font-size:15px;
}

textarea::placeholder{
    color:#666679;

.icon{

        display:none;

        padding:0 15px;

    .messages{

    .welcome{
        margin-top:50px;

    .welcome h1{
        font-size:27px;

    .input-area{
        padding:10px 10px 15px;
    }

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="brand">
        <div class="logo">✦</div>
        <div><span>JIL</span> AI</div>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>

    <div class="history-title">
        Recent chats
    </div>

    <div id="history" class="history"></div>

</aside>


<main class="main">

<header class="header">

    <div class="header-left">

        <div class="jil-avatar">🧠</div>

        <div>
            <div class="title">JIL AI</div>
            <div class="status">● Online</div>
        </div>

    </div>

    <a class="home" href="index.html">
        ← Home
    </a>

</header>


<section id="messages" class="messages">

    <div id="welcome" class="welcome">

        <div class="welcome-orb">🧠</div>

        <h1>How can I help you today?</h1>

        <p>
            Ask JIL anything. Learn, explore, create and discover.
        </p>

    </div>

</section>


<div class="input-area">

    <div class="input-box">

        <button
            class="icon"
            onclick="startVoice()"
            title="Voice input">
            🎙️
        </button>

        <textarea
            id="userInput"
            rows="1"
            placeholder="Message JIL..."
            oninput="resizeInput()"
            onkeydown="handleKey(event)">
        </textarea>

        <button
            class="icon send"
            onclick="sendMessage()"
            title="Send">
            ➤
        </button>

    </div>

    <div class="footer-note">
        JIL AI can make mistakes. Check important information.
    </div>

</div>

</main>
</div>


<script>

function timeNow(){
    return new Date().toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    });
}


function resizeInput(){

    const input=document.getElementById("userInput");

    input.style.height="auto";

    input.style.height=
        Math.min(input.scrollHeight,150)+"px";
}


function handleKey(event){

    if(event.key==="Enter" && !event.shiftKey){

        event.preventDefault();

        sendMessage();
    }
}


function addMessage(type,text){

    const welcome=document.getElementById("welcome");

    if(welcome){
        welcome.style.display="none";
    }

    const messages=document.getElementById("messages");

    const message=document.createElement("div");

    message.className="message "+type;

    const avatar=document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
        type==="jil" ? "🧠" : "👤";

    const content=document.createElement("div");

    content.className="content";

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    const time=document.createElement("div");

    time.className="time";

    time.textContent=timeNow();

    content.appendChild(bubble);
    content.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    messages.scrollTop=messages.scrollHeight;
}


function showThinking(){

    const messages=document.getElementById("messages");

    const message=document.createElement("div");

    message.className="message jil";
    message.id="thinkingMessage";

    const avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.textContent="🧠";

    const content=document.createElement("div");

    content.className="content";

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.innerHTML=`
        <div class="thinking">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    `;

    content.appendChild(bubble);

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    messages.scrollTop=messages.scrollHeight;
}


function removeThinking(){

    const thinking=document.getElementById("thinkingMessage");

    if(thinking){
        thinking.remove();
    }
}


async function sendMessage(){

    const input=document.getElementById("userInput");

    const text=input.value.trim();

    if(!text){
        return;
    }

    addMessage("user",text);

    input.value="";

    resizeInput();

    showThinking();

    try{

        const response=await fetch("/api/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:text
            })
        });


        const raw=await response.text();

        let data;

        try{
            data=JSON.parse(raw);
        }catch{
            throw new Error(
                "The server returned an invalid response."
            );
        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "The AI server returned an error."
            );
        }


        if(!data.reply){

            throw new Error(
                "The AI server returned no reply."
            );
        }


        removeThinking();

        addMessage("jil",data.reply);

        saveHistory();

    }catch(error){

        removeThinking();

        console.error("JIL ERROR:",error);

        addMessage(
            "jil",
            "⚠️ JIL couldn't connect to the AI brain.\n\n" +
            error.message
        );
    }
}


function newChat(){

    document.getElementById("messages").innerHTML=`
        <div id="welcome" class="welcome">

            <div class="welcome-orb">🧠</div>

            <h1>How can I help you today?</h1>

            <p>
                Ask JIL anything. Learn, explore, create and discover.
            </p>

        </div>
    `;

    localStorage.removeItem("jilChatHistory");

    loadHistory();
}


function saveHistory(){

    const messages=document.querySelectorAll(
        "#messages .message:not(#thinkingMessage)"
    );

    const history=[];

    messages.forEach(message=>{

        const type=
            message.classList.contains("user")
            ? "user"
            : "jil";

        const bubble=message.querySelector(".bubble");

        if(bubble){

            history.push({
                type:type,
                text:bubble.textContent
            });
        }
    });

    localStorage.setItem(
        "jilChatHistory",
        JSON.stringify(history)
    );

    loadHistory();
}


function loadHistory(){

    const historyElement=
        document.getElementById("history");

    if(!historyElement){
        return;
    }

    historyElement.innerHTML="";

    const saved=JSON.parse(
        localStorage.getItem("jilChatHistory") || "[]"
    );

    saved
        .filter(item=>item.type==="user")
        .slice(-8)
        .reverse()
        .forEach(item=>{

            const div=document.createElement("div");

            div.className="history-item";

            div.textContent=item.text;

            historyElement.appendChild(div);
        });
}


function startVoice(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }

    const recognition=new SpeechRecognition();

    recognition.lang="en-US";

    recognition.interimResults=false;

    recognition.onresult=function(event){

        const text=
            event.results[0][0].transcript;

        const input=
            document.getElementById("userInput");

        input.value=text;

        resizeInput();
    };

    recognition.onerror=function(){

        alert("I couldn't hear that. Please try again.");
    };

    recognition.start();
}


loadHistory();

document
    .getElementById("userInput")
    .focus();

</script>

</body>
</html>
